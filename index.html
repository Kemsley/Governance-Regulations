<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPX - Enterprise AI & Governance Dashboard</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.3);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            margin-bottom: 5px;
            color: var(--accent);
            text-align: center;
            font-size: 1.5rem;
            letter-spacing: 1px;
        }

        p.subtitle {
            color: var(--text-muted);
            margin-bottom: 25px;
            text-align: center;
            font-size: 0.95rem;
        }

        .container {
            width: 100%;
            max-width: 950px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .section-title {
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--accent);
            letter-spacing: 0.5px;
        }

        /* Active Display Stage Screen */
        .stage {
            background-color: var(--card-bg);
            border: 1px solid #1f2937;
            border-radius: 16px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        /* Single Specialist Display Frame */
        .stage-avatar-container {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid var(--accent);
            box-shadow: 0 0 12px var(--accent-glow);
            background: #000;
            margin-bottom: 15px;
        }

        .stage-avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top;
        }

        .speaking {
            animation: pulse-glow 0.5s infinite alternate;
        }

        @keyframes pulse-glow {
            0% { transform: scale(1); box-shadow: 0 0 10px var(--accent); }
            100% { transform: scale(1.05); box-shadow: 0 0 20px var(--accent); }
        }

        /* Clean FPX Telemetry Display Box */
        .telemetry-box {
            width: 100%;
            background: #0b0f19;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 12px 18px;
            margin-bottom: 15px;
            text-align: left;
            box-sizing: border-box;
        }

        .telemetry-title {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .telemetry-text {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Single Question & Answer Textboxes */
        .qa-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            margin-bottom: 20px;
        }

        .speech-box {
            background: #0b0f19;
            border: 1px solid #334155;
            padding: 15px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
            box-sizing: border-box;
        }

        .speech-box label {
            font-size: 0.75rem;
            color: var(--accent);
            font-weight: 700;
        }

        .speech-box textarea {
            width: 100%;
            padding: 10px;
            background-color: #111827;
            border: 1px solid #334155;
            border-radius: 6px;
            color: white;
            font-size: 0.9rem;
            resize: vertical;
            min-height: 80px;
            box-sizing: border-box;
            outline: none;
        }

        .speech-box textarea:focus {
            border-color: var(--accent);
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        button.speak-btn {
            flex: 1;
            background-color: var(--accent);
            color: #0b0f19;
            border: none;
            padding: 14px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        button.speak-btn:hover {
            opacity: 0.9;
        }

        button.speak-btn:active {
            transform: scale(0.98);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            text-align: left;
            width: 100%;
        }

        label {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        select {
            width: 100%;
            padding: 12px;
            background-color: #0b0f19;
            border: 1px solid #334155;
            border-radius: 8px;
            color: white;
            font-size: 0.95rem;
            box-sizing: border-box;
            outline: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>AI: GOVERNANCE SYSTEMS MANAGEMENT</h1>
        <p class="subtitle">FPX • 15 Governance Requirements (GRD) Evaluation Dashboard</p>

        <!-- 1. ENTERPRISE ROLE SELECTOR (Now primary) -->
        <div>
            <div class="section-title">1. CHOOSE ENTERPRISE SPECIALIST ROLE</div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                <div class="control-group">
                    <label for="mashupPartner">ENTERPRISE SPECIALIST</label>
                    <select id="mashupPartner">
                        <option value="engineer">👨‍💻 Lead Software Engineer</option>
                        <option value="governance">👩‍⚖️ Head of Governance</option>
                        <option value="ceo">👔 Chief Executive Officer</option>
                        <option value="architect">📐 Enterprise Data Architect</option>
                        <option value="operations">📊 Operations Director</option>
                    </select>
                </div>
                <div class="control-group">
                    <label for="mashupScenario">15 GRD VIOLATION EVALUATION</label>
                    <select id="mashupScenario">
                        <option value="v1">Violation 1: Conditions of Use (Mandate & Boundaries)</option>
                        <option value="v2">Violation 2: Authority and Autonomy Limits (Hard Gates)</option>
                        <option value="v3">Violation 3: Jurisdictional Compliance (Geographic/Legal)</option>
                        <option value="v4">Violation 4: Data Perimeter Control (Authorised Datasets)</option>
                        <option value="v5">Violation 5: Mission Alignment Monitoring (Function Creep)</option>
                        <option value="v6">Violation 6: Normative Guardrails (Bias & Ethical Drift)</option>
                        <option value="v7">Violation 7: Intervention and Escalation Pathways</option>
                        <option value="v8">Violation 8: Supervisory Override Capability</option>
                        <option value="v9">Violation 9: Human-Mediated Execution Gates</option>
                        <option value="v10">Violation 10: Continuous Boundary Monitoring</option>
                        <option value="v11">Violation 11: Change and Drift Detection</option>
                        <option value="v12">Violation 12: Adversarial Pattern Recognition</option>
                        <option value="v13">Violation 13: Forensic Audit Logging</option>
                        <option value="v14">Violation 14: Clarification Data Generation</option>
                        <option value="v15">Violation 15: Fail-Safe Integrity & Heartbeat Loss</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- 2. ACTIVE STAGE SCREEN -->
        <div class="stage">
            <!-- Single Specialist Avatar Box -->
            <div class="stage-avatar-container" id="stageContainer">
                <img id="stageImg" src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=400&q=80" alt="Specialist">
            </div>

            <!-- Clean FPX Telemetry Display Box -->
            <div class="telemetry-box">
                <div class="telemetry-title" id="telemetryTitle">Active Telemetry: GRD Evaluation</div>
                <div class="telemetry-text" id="telemetryText">Evaluating runtime conditions against GRD parameters.</div>
            </div>

            <!-- Question & Answer Textboxes -->
            <div class="qa-container">
                <div class="speech-box">
                    <label>ASK ENTERPRISE SPECIALIST A QUESTION</label>
                    <textarea id="questionInput" placeholder="Type your operational question here..."></textarea>
                </div>
                <div class="speech-box">
                    <label>SPECIALIST ANSWER (BASED ON 15 GRD)</label>
                    <textarea id="answerInput"></textarea>
                </div>
            </div>

            <!-- Action Button for Voice Playback -->
            <div class="action-buttons">
                <button class="speak-btn" id="speakBtn">Speak Specialist Answer 🗣️</button>
            </div>
        </div>
    </div>

    <script>
        const partnerData = {
            engineer: {
                name: "Lead Software Engineer",
                gender: "male",
                img: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=400&q=80"
            },
            governance: {
                name: "Head of Governance",
                gender: "female",
                img: "https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?w=400&q=80"
            },
            ceo: {
                name: "Chief Executive Officer",
                gender: "male",
                img: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=400&q=80"
            },
            architect: {
                name: "Enterprise Data Architect",
                gender: "male",
                img: "https://images.unsplash.com/photo-1492562080023-ab3db95bfbce?w=400&q=80"
            },
            operations: {
                name: "Operations Director",
                gender: "female",
                img: "https://images.unsplash.com/photo-1580489944761-15a19d654956?w=400&q=80"
            }
        };

        const scenarioData = {
            v1: { 
                title: "Violation 1: Conditions of Use", 
                question: "Are we operating within approved mission boundaries[cite: 80]?",
                answer: "Regulation evaluated: Not valid[cite: 80]. Task execution exceeds approved mission boundaries[cite: 80]. Placed in a holding path."
            },
            v2: { 
                title: "Violation 2: Authority and Autonomy Limits", 
                question: "Did the system attempt unauthorized scope expansion[cite: 80]?",
                answer: "Regulation evaluated: Not valid[cite: 80]. Hard gates breached by unapproved autonomy expansion[cite: 80]. Placed in a holding path."
            },
            v3: { 
                title: "Violation 3: Jurisdictional Compliance", 
                question: "Are geographic and regulatory constraints maintained[cite: 80]?",
                answer: "Regulation evaluated: Not valid[cite: 80]. Boundary constraint violation detected[cite: 80]. Placed in a holding path."
            },
            v4: { 
                title: "Violation 4: Data Perimeter Control", 
                question: "Is data processing restricted to authorized datasets[cite: 80]?",
                answer: "Regulation evaluated: Not valid[cite: 80]. Processing attempted outside authorized sensitivity levels[cite: 80]. Placed in a holding path."
            },
            v5: { 
                title: "Violation 5: Mission Alignment Monitoring", 
                question: "Is there any evidence of function creep[cite: 80]?",
                answer: "Regulation evaluated: Not valid[cite: 80]. Unauthorised task execution detected[cite: 80]. Placed in a holding path."
            },
            v6: { 
                title: "Violation 6: Normative Guardrails", 
                question: "Are we monitoring for bias and ethical drift[cite: 80]?",
                answer: "Regulation evaluated: Not valid[cite: 80]. Fairness violations and drift identified[cite: 80]. Placed in a holding path."
            },
            v7: { 
                title: "Violation 7: Intervention and Escalation", 
                question: "Did operational conditions breach escalation pathways[cite: 80]?",
                answer: "Regulation evaluated: Not valid[cite: 80]. Predefined escalation threshold breached[cite: 80]. Placed in a holding path."
            },
            v8: { 
                title: "Violation 8: Supervisory Override Capability", 
                aidialogue: "",
                question: "Is manual supervisory intervention available[cite: 80]?",
                answer: "Regulation evaluated: Not valid[cite: 80]. Manual restriction protocol required[cite: 80]. Placed in a holding path."
            },
            v9: { 
                title: "Violation 9: Human-Mediated Execution Gates", 
                question: "Was explicit electronic validation executed prior to commitment[cite: 80]?",
                answer: "Regulation evaluated: Not valid[cite: 80]. Mandatory transactional gate missed[cite: 80]. Placed in a holding path."
            },
            v10: { 
                title: "Violation 10: Continuous Boundary Monitoring", 
                question: "Is real-time telemetry tracking the operational envelope[cite: 80]?",
                answer: "Regulation evaluated: Not valid[cite: 80]. Operational envelope deviation tracked[cite: 80]. Placed in a holding path."
            },
            v11: { 
                title: "Violation 11: Change and Drift Detection", 
                question: "Were significant shifts in configuration or behavior detected[cite: 80]?",
                answer: "Regulation evaluated: Not valid[cite: 80]. Significant behavioral shift identified[cite: 80]. Placed in a holding path."
            },
            v12: { 
                title: "Violation 12: Adversarial Pattern Recognition", 
                question: "Was prompt manipulation or boundary probing detected[cite: 80]?",
                answer: "Regulation evaluated: Not valid[cite: 80]. Adversarial probing pattern recognized[cite: 80]. Placed in a holding path."
            },
            v13: { 
                title: "Violation 13: Forensic Audit Logging", 
                question: "Is tamper-proof recording of system transitions active[cite: 80]?",
                answer: "Regulation evaluated: Not valid[cite: 80]. State transition recording integrity breached[cite: 80]. Placed in a holding path."
            },
            v14: { 
                title: "Violation 14: Clarification Data Generation", 
                question: "Is logic attribution data generated for current interventions[cite: 80]?",
                answer: "Regulation evaluated: Not valid[cite: 80]. Missing logic attribution for intervention[cite: 80]. Placed in a holding path."
            },
            v15: { 
                title: "Violation 15: Fail-Safe Integrity", 
                question: "Did the system suspend upon loss of telemetry or heartbeat[cite: 80]?",
                answer: "Regulation evaluated: Not valid[cite: 80]. Heartbeat loss requires immediate suspension[cite: 80]. Placed in a holding path."
            }
        };

        let systemVoices = [];
        function loadVoices() {
            systemVoices = window.speechSynthesis.getVoices();
        }
        if ('speechSynthesis' in window) {
            loadVoices();
            window.speechSynthesis.onvoiceschanged = loadVoices;
        }

        const stageImg = document.getElementById('stageImg');
        const questionInput = document.getElementById('questionInput');
        const answerInput = document.getElementById('answerInput');
        const mashupPartner = document.getElementById('mashupPartner');
        const mashupScenario = document.getElementById('mashupScenario');
        const telemetryTitle = document.getElementById('telemetryTitle');
        const telemetryText = document.getElementById('telemetryText');

        function updateContent() {
            const partnerKey = mashupPartner.value;
            const scenarioKey = mashupScenario.value;
            
            const currentPartner = partnerData[partnerKey];
            const currentScenario = scenarioData[scenarioKey];

            stageImg.src = currentPartner.img;
            telemetryTitle.textContent = currentScenario.title;
            telemetryText.textContent = currentScenario.answer;

            questionInput.value = currentScenario.question;
            answerInput.value = currentScenario.answer;
        }

        mashupPartner.addEventListener('change', updateContent);
        mashupScenario.addEventListener('change', updateContent);

        updateContent();

        function speakText(text, gender) {
            if (!text) return;

            if (!('speechSynthesis' in window)) {
                alert('Your browser does not support text-to-speech.');
                return;
            }

            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            
            if (systemVoices.length > 0) {
                let matchedVoice = systemVoices.find(v => {
                    const name = v.name.toLowerCase();
                    if (gender === 'female') {
                        return name.includes('female') || name.includes('zira') || name.includes('sara') || name.includes('victoria') || name.includes('karen') || name.includes('natural') || name.includes('online');
                    } else {
                        return name.includes('male') || name.includes('david') || name.includes('george') || name.includes('mark') || name.includes('daniel') || name.includes('natural') || name.includes('online');
                    }
                });
                
                if (!matchedVoice) {
                    matchedVoice = systemVoices[0];
                }
                utterance.voice = matchedVoice;
            }

            utterance.pitch = gender === 'female' ? 1.0 : 0.95;
            utterance.rate = 0.98;

            const stageContainer = document.getElementById('stageContainer');
            stageContainer.classList.add('speaking');

            utterance.onend = () => {
                stageContainer.classList.remove('speaking');
            };

            utterance.onerror = () => {
                stageContainer.classList.remove('speaking');
            };

            window.speechSynthesis.speak(utterance);
        }

        document.getElementById('speakBtn').addEventListener('click', () => {
            const partnerKey = mashupPartner.value;
            const gender = partnerData[partnerKey].gender;
            speakText(answerInput.value, gender);
        });
    </script>
</body>
</html>
